services:
  base: &base
    image: chatwoot/chatwoot:v4.20.1
    env_file: .env
    volumes:
      - storage_data:/app/storage
      - ./config/initializers/markchat_subscription_enforcement.rb:/app/config/initializers/markchat_subscription_enforcement.rb:ro
      - ./config/initializers/zz_markchat_community_lockdown.rb:/app/config/initializers/zz_markchat_community_lockdown.rb:ro
      - ./public/markchat_theme.css:/app/public/markchat_theme.css:ro
      - ./public/markchat_runtime.js:/app/public/markchat_runtime.js:ro
      - ./public/brand-assets:/app/public/brand-assets:ro

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data: